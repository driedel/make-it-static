services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8123:8000"
    depends_on:
      - redis
    networks:
      - default
      - make-it-static-network

  worker:
    build: ./worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
      - localstack
    networks:
      - default
      - make-it-static-network

  # ---- Local S3 for testing (remove in prod) ----
  localstack:
    image: localstack/localstack:4.6.0
    restart: unless-stopped
    environment:
      SERVICES: s3
      EAGER_SERVICE_LOADING: "1"
    env_file: .env
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro

  # ---- Local static site preview (mirrors CloudFront) ----
  preview:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      - localstack
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    env_file: .env

volumes:
  redis-data:
  localstack-data:

networks:
  make-it-static-network:
    external: true
